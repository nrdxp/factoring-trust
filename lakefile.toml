name = "FactoringTrust"
version = "0.1.0"
keywords = ["math", "formal-verification"]
defaultTargets = ["Core", "Effective", "Transport", "Witness", "Ceiling"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false

# Only `Effective` imports Mathlib (the computable stratum's `ComputablePred`/
# `Primcodable` vocabulary); `Core`, `Transport`, `Witness`, and `Ceiling` stay
# Mathlib-free by not importing it, per the project boundary's per-package TCB
# discipline.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Core"

[[lean_lib]]
name = "Effective"

[[lean_lib]]
name = "Transport"

[[lean_lib]]
name = "Witness"

[[lean_lib]]
name = "Ceiling"
